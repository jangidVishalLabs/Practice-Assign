<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sehlvet</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/style.css" />
</head>

<body>
    <!-- HEADER -->
    <header class="site-header">
        <nav class="navbar" aria-label="Primary navigation">
            <div class="nav-inner">
                <!-- Brand -->
                <a href="#" class="brand" aria-label="Sehlvet Home">Sehlvet</a>

                <!-- Nav Links -->
                <ul class="nav-links" id="primary-navigation" role="menubar">
                    <li><a href="#home" role="menuitem">Home</a></li>
                    <li><a href="#collections" role="menuitem">Collections</a></li>
                    <li><a href="#brands" role="menuitem">Brands</a></li>
                    <li><a href="#about" role="menuitem">About Us</a></li>

                    <!-- Mobile Wishlist / Cart -->
                    <li class="mobile-actions" aria-hidden="true">
                        <button class="icon-btn" aria-label="Wishlist">
                            <img src="./images/Combined-Shape.png" alt="Wishlist" loading="lazy" />
                        </button>
                        <button class="icon-btn cart" aria-label="Cart">
                            <img src="./images/Bag.png" alt="Cart" loading="lazy" />
                            <span class="badge" aria-label="6 items in cart">6</span>
                        </button>
                    </li>
                </ul>

                <!-- Desktop Wishlist / Cart -->
                <div class="nav-actions">
                    <button class="icon-btn" aria-label="Wishlist">
                        <img src="./images/Combined-Shape.png" alt="Wishlist" loading="lazy" />
                    </button>
                    <button class="icon-btn cart" aria-label="Cart">
                        <img src="./images/Bag.png" alt="Cart" loading="lazy" />
                        <span class="badge" aria-label="6 items in cart">6</span>
                    </button>
                </div>

                <!-- Mobile Menu Toggle -->
                <button class="menu-toggle" aria-label="Toggle menu" aria-controls="primary-navigation"
                    aria-expanded="false">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <main id="home">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-inner">
                <div class="hero-content">
                    <h1 id="hero-title" class="hero-title">
                        Elevate Style, <span class="nowrap">Embrace Story</span>
                    </h1>
                    <p class="hero-body">
                        We provide the largest clothing collection for any season. You can choose
                        trendy or classy designs according to your preferences. Our services are super fast,
                        and we update within 24 hours.
                    </p>
                    <div class="hero-actions">
                        <a href="#collections" class="btn btn-primary">
                            <span>Explore</span>
                            <img class="btn-icon" src="./images/Group 54.png" alt="" aria-hidden="true" />
                        </a>
                    </div>
                </div>

                <figure class="hero-media">
                    <img src="./images/Group 57.svg" alt="Elegant woman fashion portrait" class="hero-image"
                        loading="lazy" />
                </figure>
            </div>
        </section>
    </main>

</body>

</html>
